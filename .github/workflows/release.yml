name: Release

on:
  push:
    branches: [main]
    paths:
      - custom_components/tryber/manifest.json
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leggi la versione dal manifest
        id: version
        run: |
          VERSION=$(jq -r '.version' custom_components/tryber/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verifica se il tag esiste gia'
        id: check_tag
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Crea tag e release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
