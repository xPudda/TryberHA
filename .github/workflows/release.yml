name: Release

on:
  push:
    branches: [main]
    paths:
      - custom_components/tryber/manifest.json
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Leggi la versione dal manifest
        id: version
        run: |
          VERSION=$(jq -r '.version' custom_components/tryber/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verifica se il tag esiste gia'
        id: check_tag
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trova il tag della release precedente
        if: steps.check_tag.outputs.exists == 'false'
        id: prev_tag
        run: |
          PREV=$(git tag --sort=-v:refname | grep -v "^${{ steps.version.outputs.version }}$" | head -n1 || true)
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Genera le release notes dai Conventional Commits
        if: steps.check_tag.outputs.exists == 'false'
        id: notes
        run: |
          PREV_TAG="${{ steps.prev_tag.outputs.tag }}"
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          # Solo i tipi rilevanti per chi usa l'integrazione: il resto
          # (chore, ci, build, test, refactor, docs...) e' rumore interno.
          declare -A TITLES=(
            [feat]="✨ New features"
            [fix]="🐛 Bug fixes"
            [perf]="⚡ Improvements"
          )
          declare -A GROUPED

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            hash="${line%% *}"
            subject="${line#* }"
            if [[ "$subject" =~ ^([a-z]+)(\(.+\))?!?:\ (.+)$ ]]; then
              type="${BASH_REMATCH[1]}"
              desc="${BASH_REMATCH[3]}"
              if [[ -n "${TITLES[$type]:-}" ]]; then
                # Prima lettera maiuscola, per una nota leggibile.
                desc="$(tr '[:lower:]' '[:upper:]' <<< "${desc:0:1}")${desc:1}"
                GROUPED[$type]+="- $desc"$'\n'
              fi
            fi
          done < <(git log "$RANGE" --no-merges --pretty=format:'%h %s'; echo)

          {
            for type in feat fix perf; do
              if [ -n "${GROUPED[$type]:-}" ]; then
                echo "### ${TITLES[$type]}"
                echo
                printf '%s\n' "${GROUPED[$type]}"
              fi
            done
          } > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "Minor internal changes, nothing new to report for users." > release_notes.md
          fi

      - name: Crea tag e release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: release_notes.md
